<!doctype html>
<!-- Dev-only entry: same UI as index.html but with the Tauri invoke
     bridge mocked to the HTTP backend on 127.0.0.1:1430. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planetary Transfer (mock backend)</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/mock-backend.ts"></script>
  </head>
  <body>
    <div id="app">
      <aside id="left" class="panel-column">
        <section class="panel" id="time-panel">
          <h2>Time</h2>
          <div class="row">
            <input type="datetime-local" id="date-input" step="1" />
            <button id="btn-now" title="Jump to the current UTC time">Now</button>
          </div>
          <div class="row">
            <button id="btn-back-day" title="Step back one day">&lt;&lt; 1d</button>
            <button id="btn-back-hour" title="Step back one hour">&lt; 1h</button>
            <button id="btn-play" title="Play or pause">&#9654;</button>
            <button id="btn-fwd-hour" title="Step forward one hour">1h &gt;</button>
            <button id="btn-fwd-day" title="Step forward one day">1d &gt;&gt;</button>
          </div>
          <div class="row">
            <label for="speed">Speed</label>
            <select id="speed">
              <option value="1" selected>1 s/s</option>
              <option value="60">1 min/s</option>
              <option value="3600">1 h/s</option>
              <option value="86400">1 day/s</option>
              <option value="604800">1 week/s</option>
              <option value="2592000">1 month/s</option>
              <option value="31557600">1 year/s</option>
            </select>
          </div>
          <p class="hint" id="sim-utc"></p>
        </section>
        <section class="panel" id="bodies-panel">
          <h2>Bodies</h2>
          <ul id="body-list"></ul>
        </section>
      </aside>
      <main id="viewport">
        <div id="scene-container"></div>
        <div id="scene-error" class="hidden"></div>
        <div id="mobile-toggles">
          <button data-toggle="left">&#9776; Time</button>
          <button data-toggle="right">&#9776; Info</button>
        </div>
      </main>
      <aside id="right" class="panel-column">
        <section class="panel" id="inspector-panel">
          <h2>Body inspector</h2>
          <div id="inspector">
            <p class="hint">Click or tap a body to select it.</p>
          </div>
        </section>
        <section class="panel" id="transfer-panel">
          <h2>Hohmann transfer</h2>
          <div class="row">
            <label for="transfer-from">From</label>
            <select id="transfer-from"></select>
          </div>
          <div class="row">
            <label for="transfer-to">To</label>
            <select id="transfer-to"></select>
          </div>
          <div class="row">
            <label for="transfer-dep-alt">Departure alt (km)</label>
            <input type="number" id="transfer-dep-alt" value="300" min="0" step="50" />
          </div>
          <div class="row">
            <label for="transfer-arr-alt">Arrival alt (km)</label>
            <input type="number" id="transfer-arr-alt" value="300" min="0" step="50" />
          </div>
          <div class="row">
            <button id="btn-transfer">Compute</button>
            <button id="btn-transfer-clear">Clear</button>
          </div>
          <div id="transfer-results">
            <p class="hint">Pick two bodies orbiting the same primary.</p>
          </div>
        </section>
        <section class="panel" id="settings-panel">
          <h2>Settings</h2>
          <div class="row">
            <label for="units">Units</label>
            <select id="units">
              <option value="au" selected>AU</option>
              <option value="km">km</option>
            </select>
          </div>
          <div class="row">
            <label for="scale">Distance scale</label>
            <select id="scale">
              <option value="compressed">Compressed</option>
              <option value="realistic" selected>Realistic</option>
            </select>
          </div>
          <div class="row">
            <label><input type="checkbox" id="show-trails" checked /> Orbit trails</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="show-labels" checked /> Labels</label>
          </div>
          <div class="row">
            <label><input type="checkbox" id="follow-selected" checked /> Follow selected body</label>
          </div>
          <p class="hint">Ephemeris: JPL SPICE de440s (1849&ndash;2150). Data credit: NAIF/JPL.</p>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
